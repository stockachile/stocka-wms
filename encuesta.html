<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Encuesta de Satisfacción - WMS STOCKA</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/png" href="./favicon.png">
  <link rel="apple-touch-icon" href="./favicon.png">
  <link href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css" rel="stylesheet" />
  <link rel="stylesheet" href="./css/style.css?v=1.0.3">
  <link rel="stylesheet" href="./css/layout.css?v=1.0.1">
  <script src="./js/theme.js"></script>
  <style>
    body {
      background: var(--color-bg);
      color: var(--color-text-main);
      font-family: var(--font-family, 'Inter', sans-serif);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      margin: 0;
      padding: 0;
    }
    .survey-standalone-header {
      background: var(--color-surface);
      border-bottom: 1px solid var(--color-border);
      padding: 1rem 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: var(--shadow-sm);
    }
    .survey-standalone-logo {
      height: 32px;
      object-fit: contain;
    }
    .survey-standalone-main {
      flex: 1;
      padding: 2rem 1rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .survey-standalone-footer {
      padding: 1.5rem;
      text-align: center;
      font-size: 0.8rem;
      color: var(--color-text-muted);
      border-top: 1px solid var(--color-border);
      background: var(--color-surface);
    }
  </style>
</head>
<body>

  <header class="survey-standalone-header">
    <div style="display: flex; align-items: center; gap: 0.75rem;">
      <img src="https://cdn.shopify.com/s/files/1/0625/6141/9483/files/Stocka_1300_x_500_px_519_x_200_px_5.png?v=1779650350" alt="STOCKA Logo" class="survey-standalone-logo">
      <span style="font-size: 0.85rem; font-weight: 600; color: var(--color-text-muted); border-left: 1px solid var(--color-border); padding-left: 0.75rem;">
        Feedback & Reviews
      </span>
    </div>
    <button class="theme-toggle-btn" aria-label="Cambiar tema">
      <i class="ri-sun-line sun-icon"></i>
      <i class="ri-moon-line moon-icon"></i>
    </button>
  </header>

  <main class="survey-standalone-main" id="survey-main-container">
    <div id="survey-loading" style="text-align: center; padding: 3rem;">
      <i class="ri-loader-4-line ri-spin" style="font-size: 2.5rem; color: var(--color-primary); margin-bottom: 1rem; display: inline-block;"></i>
      <p style="color: var(--color-text-muted); font-size: 0.95rem;">Cargando encuesta...</p>
    </div>
  </main>

  <footer class="survey-standalone-footer">
    <div>WMS STOCKA &bull; Sistema de Gestión y Logística de Bodega</div>
    <div style="font-size: 0.72rem; margin-top: 0.25rem; opacity: 0.75;">Tus respuestas se envían de forma segura.</div>
  </footer>

  <!-- Supabase CDN & SweetAlert2 -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <script type="module">
    import supabase from './js/supabase.js';
    import { renderSurveyWizard } from './js/surveys.js?v=1.0.2';

    async function initStandaloneSurvey() {
      const mainContainer = document.getElementById('survey-main-container');
      const params = new URLSearchParams(window.location.search);
      const surveyId = params.get('id');
      const token = params.get('token');

      if (!surveyId && !token) {
        renderError('No se especificó ninguna encuesta para responder. Por favor verifica el enlace.');
        return;
      }

      try {
        let query = supabase.from('surveys').select('*');
        if (surveyId) {
          query = query.eq('id', surveyId);
        } else {
          query = query.eq('public_token', token);
        }

        const { data, error } = await query.maybeSingle();

        if (error) throw error;
        if (!data) {
          renderError('La encuesta solicitada no existe o el enlace es incorrecto.');
          return;
        }

        if (data.status !== 'published' || !data.is_active) {
          renderError('Esta encuesta ya no se encuentra activa o ha sido cerrada.');
          return;
        }

        // Obtener usuario autenticado si existe
        let userProfile = null;
        try {
          const { data: { session } } = await supabase.auth.getSession();
          if (session) {
            const { data: prof } = await supabase.from('profiles').select('id, full_name, email, comercio').eq('id', session.user.id).single();
            if (prof) userProfile = prof;
          }
        } catch (e) {
          // Usuario no autenticado (responde anónimo/externo)
        }

        document.title = `${data.title} - WMS STOCKA`;

        // Renderizar el wizard
        mainContainer.innerHTML = '';
        renderSurveyWizard(data, mainContainer, {
          isPreview: false,
          userProfile: userProfile,
          onComplete: () => {
            mainContainer.innerHTML = `
              <div class="card" style="padding: 3rem 2rem; max-width: 550px; text-align: center; margin: 0 auto;">
                <div style="width: 64px; height: 64px; border-radius: 50%; background: rgba(16, 185, 129, 0.15); color: #10b981; display: flex; align-items: center; justify-content: center; font-size: 2.2rem; margin: 0 auto 1.25rem auto;">
                  <i class="ri-check-double-line"></i>
                </div>
                <h2 style="font-size: 1.4rem; font-weight: 700; margin-bottom: 0.5rem; color: var(--color-text-main);">
                  ${data.settings?.success_title || '¡Gracias por tu respuesta!'}
                </h2>
                <p style="color: var(--color-text-muted); font-size: 0.9rem; margin-bottom: 1.5rem; line-height: 1.5;">
                  ${data.settings?.success_message || 'Tu feedback ha sido guardado exitosamente y nos ayuda a brindar un mejor servicio.'}
                </p>
                <div style="font-size: 0.8rem; color: var(--color-text-muted);">
                  Ya puedes cerrar esta ventana con seguridad.
                </div>
              </div>
            `;
          }
        });

      } catch (err) {
        console.error('Error al inicializar encuesta:', err);
        renderError(err.message || 'Error de conexión con el servidor.');
      }
    }

    function renderError(message) {
      const mainContainer = document.getElementById('survey-main-container');
      mainContainer.innerHTML = `
        <div class="card" style="padding: 2.5rem; max-width: 520px; text-align: center; margin: 0 auto;">
          <div style="width: 56px; height: 56px; border-radius: 50%; background: rgba(239, 68, 68, 0.12); color: var(--color-danger); display: flex; align-items: center; justify-content: center; font-size: 2rem; margin: 0 auto 1.25rem auto;">
            <i class="ri-error-warning-line"></i>
          </div>
          <h3 style="font-size: 1.2rem; font-weight: 700; color: var(--color-text-main); margin-bottom: 0.5rem;">
            Encuesta no disponible
          </h3>
          <p style="color: var(--color-text-muted); font-size: 0.88rem; line-height: 1.5; margin-bottom: 1.5rem;">
            ${message}
          </p>
          <a href="./dashboard.html" class="btn btn-outline" style="font-size: 0.85rem;">
            Ir al Dashboard
          </a>
        </div>
      `;
    }

    initStandaloneSurvey();
  </script>
</body>
</html>
