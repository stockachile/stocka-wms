name: Sync Envíame to Supabase

on:
  schedule:
    # Minutos fuera de hora punta (:07, :27, :47) para evitar congestión/drops de cola cron en GitHub Actions
    - cron: '7,27,47 * * * *'
  workflow_dispatch:
    # Permite gatillar la sincronización manualmente desde GitHub Actions o desde el WMS

concurrency:
  group: sync-enviame-to-supabase
  cancel-in-progress: false

jobs:
  sync:
    name: Run Envíame Sync
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Run Sincronización Envíame
        env:
          ENVIAME_API_KEY: ${{ secrets.ENVIAME_API_KEY || '6boQAR4qOMMZxjS1DJlrnOPqj0Vp8n' }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node sync_enviame.js
