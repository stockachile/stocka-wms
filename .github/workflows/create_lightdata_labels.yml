name: Create LightData Labels

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Modo de ejecución: individual o bulk'
        required: true
        default: 'individual'
        type: choice
        options:
          - individual
          - bulk
      orderId:
        description: 'ID de la orden (UUID) en Supabase (Solo modo individual)'
        required: false
        type: string
      limit:
        description: 'Límite de órdenes a procesar (Solo modo bulk)'
        required: false
        default: '10'
        type: string
      orderIds:
        description: 'Lista de IDs de ordenes separados por comas (Solo modo bulk específico)'
        required: false
        type: string

  repository_dispatch:
    types: [create_label]

jobs:
  create-labels:
    name: Generate Labels in LightData
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Get Playwright version
        id: playwright-version
        run: echo "version=$(npm ls playwright --json | jq -r '.dependencies.playwright.version')" >> $GITHUB_OUTPUT

      - name: Cache Playwright Browser Binaries
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright Chromium with dependencies
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright Dependencies (if cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Restore Session State Cache
        uses: actions/cache@v4
        with:
          path: lightdata_state.json
          key: ${{ runner.os }}-lightdata-session-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-lightdata-session-

      - name: Run Label Creation Script
        env:
          LIGHTDATA_USERNAME: ${{ secrets.LIGHTDATA_USERNAME }}
          LIGHTDATA_PASSWORD: ${{ secrets.LIGHTDATA_PASSWORD }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          HEADLESS: 'true'
        run: |
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            MODE="${{ github.event.client_payload.mode }}"
            ORDER_ID="${{ github.event.client_payload.orderId }}"
            LIMIT="${{ github.event.client_payload.limit }}"
            ORDER_IDS="${{ github.event.client_payload.orderIds }}"
          else
            MODE="${{ github.event.inputs.mode }}"
            ORDER_ID="${{ github.event.inputs.orderId }}"
            LIMIT="${{ github.event.inputs.limit }}"
            ORDER_IDS="${{ github.event.inputs.orderIds }}"
          fi

          echo "Ejecutando en modo: $MODE"
          
          if [ "$MODE" = "individual" ]; then
            node create_lightdata_labels.js --mode=individual --orderId="$ORDER_ID"
          elif [ "$MODE" = "bulk" ]; then
            LIMIT_VAL=${LIMIT:-10}
            node create_lightdata_labels.js --mode=bulk --limit="$LIMIT_VAL" --orderIds="$ORDER_IDS"
          else
            echo "❌ Modo no válido especificado."
            exit 1
          fi
