name: Sync Starken Pro to Supabase

on:
  schedule:
    # Se ejecuta cada 3 horas (UTC: 1, 4, 7, 10, 13, 16, 19, 22) desfasado 1 hora de Bluex
    - cron: '0 1,4,7,10,13,16,19,22 * * *'
  workflow_dispatch:
    # Permite gatillar la sincronización manualmente desde GitHub Actions o desde el WMS

jobs:
  sync:
    name: Run Starken Pro Sync
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm install --prefer-offline --no-audit --no-fund

      - name: Get Playwright version
        id: playwright-version
        run: echo "version=$(npm ls playwright --json | jq -r '.dependencies.playwright.version')" >> $GITHUB_OUTPUT

      - name: Cache Playwright Browser Binaries
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium

      - name: Run Sincronización Starken Pro
        env:
          STARKEN_USERNAME: ${{ secrets.STARKEN_USERNAME }}
          STARKEN_PASSWORD: ${{ secrets.STARKEN_PASSWORD }}
          STARKEN_STATE_JSON: ${{ secrets.STARKEN_STATE_JSON }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          HEADLESS: 'true'
        run: node sync_starken.js
