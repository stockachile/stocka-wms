<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Tarjeta de Presentación Virtual - Stocka WMS</title>
  
  <!-- Remixicon for icons -->
  <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
  
  <!-- Google Fonts: Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --primary-light: rgba(37, 99, 235, 0.08);
      --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
      --card-bg: rgba(255, 255, 255, 0.96);
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border-color: rgba(226, 232, 240, 0.8);
      --radius: 20px;
      --shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.3);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    body {
      background: var(--bg-gradient);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.25rem;
      color: var(--text-main);
    }

    .vcard-container {
      width: 100%;
      max-width: 440px;
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.2);
      animation: cardAppear 0.5s cubic-bezier(0.16, 1, 0.3, 1);
      position: relative;
    }

    @keyframes cardAppear {
      from { opacity: 0; transform: translateY(20px) scale(0.96); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* Header & Cover Banner */
    .card-cover {
      height: 120px;
      background: linear-gradient(135deg, #1e3a8a 0%, #2563eb 50%, #3b82f6 100%);
      position: relative;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      padding: 1rem 1.25rem;
    }

    .brand-logo {
      display: flex;
      align-items: center;
    }

    .brand-logo img {
      height: 30px;
      width: auto;
      max-width: 140px;
      object-fit: contain;
    }

    .verified-badge {
      background: rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(8px);
      color: #ffffff;
      padding: 0.35rem 0.75rem;
      border-radius: 50px;
      font-size: 0.75rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 0.35rem;
      border: 1px solid rgba(255, 255, 255, 0.3);
    }

    /* Profile Avatar Section */
    .profile-header {
      padding: 0 1.5rem 1.25rem 1.5rem;
      text-align: center;
      position: relative;
      margin-top: -50px;
    }

    .avatar-wrapper {
      position: relative;
      display: inline-block;
      margin-bottom: 0.75rem;
    }

    .avatar-img {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      object-fit: cover;
      border: 4px solid #ffffff;
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.12);
      background: #f1f5f9;
    }

    .avatar-placeholder {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      border: 4px solid #ffffff;
      background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
      color: #ffffff;
      font-size: 2.2rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.12);
    }

    .status-dot {
      position: absolute;
      bottom: 6px;
      right: 6px;
      width: 16px;
      height: 16px;
      background: #10b981;
      border: 3px solid #ffffff;
      border-radius: 50%;
    }

    .profile-name {
      font-size: 1.4rem;
      font-weight: 800;
      color: var(--text-main);
      letter-spacing: -0.4px;
      margin-bottom: 0.2rem;
    }

    .profile-role {
      font-size: 0.92rem;
      font-weight: 600;
      color: var(--primary);
      margin-bottom: 0.35rem;
    }

    .profile-company {
      font-size: 0.82rem;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.35rem;
      font-weight: 500;
    }

    .bio-text {
      font-size: 0.85rem;
      color: #475569;
      line-height: 1.45;
      margin: 0.85rem 0 0 0;
      padding: 0.65rem 0.85rem;
      background: #f8fafc;
      border-radius: 12px;
      border: 1px solid #f1f5f9;
    }

    /* Main CTA Button */
    .cta-container {
      padding: 0 1.5rem 1.25rem 1.5rem;
    }

    .btn-vcard-save {
      width: 100%;
      padding: 0.9rem 1.25rem;
      background: var(--primary);
      color: #ffffff;
      border: none;
      border-radius: 14px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
      box-shadow: 0 10px 20px -5px rgba(37, 99, 235, 0.4);
      transition: all 0.2s ease;
      text-decoration: none;
    }

    .btn-vcard-save:hover, .btn-vcard-save:active {
      background: var(--primary-hover);
      transform: translateY(-2px);
      box-shadow: 0 12px 24px -5px rgba(37, 99, 235, 0.5);
    }

    /* Contact Links Grid */
    .contact-grid {
      padding: 0 1.5rem 1.5rem 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .contact-item {
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 0.85rem 1rem;
      background: #f8fafc;
      border: 1px solid var(--border-color);
      border-radius: 14px;
      text-decoration: none;
      color: var(--text-main);
      transition: all 0.2s ease;
    }

    .contact-item:hover {
      background: #ffffff;
      border-color: var(--primary);
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.08);
      transform: translateX(3px);
    }

    .contact-icon {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      background: #ffffff;
      color: var(--primary);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.25rem;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.05);
      flex-shrink: 0;
    }

    .contact-info {
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .contact-label {
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .contact-value {
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text-main);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Footer */
    .card-footer {
      padding: 1rem 1.5rem;
      background: #f1f5f9;
      border-top: 1px solid var(--border-color);
      text-align: center;
      font-size: 0.78rem;
      color: var(--text-muted);
      font-weight: 500;
    }

    .card-footer a {
      color: var(--primary);
      text-decoration: none;
      font-weight: 700;
    }

    /* State: Loading & Error */
    .vcard-state {
      padding: 3rem 1.5rem;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1rem;
    }

    .spinner {
      width: 44px;
      height: 44px;
      border: 3.5px solid rgba(37, 99, 235, 0.15);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .error-icon {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: #fef2f2;
      color: #ef4444;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      margin-bottom: 0.5rem;
    }

    .error-title {
      font-size: 1.15rem;
      font-weight: 700;
      color: #0f172a;
    }

    .error-desc {
      font-size: 0.88rem;
      color: #64748b;
      line-height: 1.5;
    }
  </style>
</head>
<body>

  <div class="vcard-container" id="vcard-app">
    <!-- State: Loading -->
    <div class="vcard-state" id="vcard-loading">
      <div class="spinner"></div>
      <p style="font-weight: 600; color: #475569;">Cargando credencial Stocka...</p>
    </div>

    <!-- State: Content (Rendered dynamically) -->
    <div id="vcard-content" style="display: none;"></div>

    <!-- State: Error/Revoked (Rendered dynamically if token invalid) -->
    <div class="vcard-state" id="vcard-error" style="display: none;">
      <div class="error-icon"><i class="ri-shield-keyhole-line"></i></div>
      <h3 class="error-title" id="error-title">Credencial no disponible</h3>
      <p class="error-desc" id="error-desc">El código QR escaneado no existe o ha sido inactivado por razones de seguridad.</p>
      <a href="https://wms.stocka.cl" style="margin-top: 1rem; padding: 0.6rem 1.2rem; background: #e2e8f0; color: #334155; text-decoration: none; border-radius: 10px; font-weight: 600; font-size: 0.85rem;">
        Ir al Portal Stocka
      </a>
    </div>
  </div>

  <!-- Supabase JS Client & Main App Script -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script type="module" src="js/vcard.js"></script>

</body>
</html>
